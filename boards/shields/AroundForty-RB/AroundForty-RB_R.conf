CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
# ノイズ低減・微小移動補正などを行うスマートアルゴリズム
CONFIG_PMW3610_SMART_ALGORITHM=y
# BLE で送る報告の間隔は AroundForty-RB_R.overlay の trackball_rate_limit (15ms) でまとめる。
# ドライバの CONFIG_PMW3610_REPORT_INTERVAL_MIN は、間隔が空くと移動量を捨てるので使わない
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
# ドライバの既定は 500。長く止めたあと動かし始めたときの反応を速くする
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Battery
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# RGB LED widget
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
