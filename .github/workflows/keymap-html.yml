name: Generate KEYMAP.html

# Regenerate the standalone KEYMAP.html whenever the Markdown source (or the
# generator) changes, and commit the result back to the same branch.
on:
  push:
    paths:
      - 'KEYMAP.md'
      - 'tools/gen_keymap_html.py'
      - '.github/workflows/keymap-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keymap-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate KEYMAP.html
        run: python tools/gen_keymap_html.py

      - name: Commit KEYMAP.html if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- KEYMAP.html; then
            echo "KEYMAP.html is up to date."
          else
            git add KEYMAP.html
            git commit -m "docs: regenerate KEYMAP.html from KEYMAP.md"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
